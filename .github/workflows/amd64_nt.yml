---
name: AMD64_NT

on:
  workflow_call:
    inputs:
      os:
        default: windows-latest
        required: false
        type: string
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_NT-d5.12.0.7z
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 35

    defaults:
      run: {shell: cmd}

    env:
      CM3_TARGET: AMD64_NT

    steps:
    - name: Setup SDK environment
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Define install location
      shell: pwsh
      run: "CM3_INSTALL=%CD%/../install/cm3" >> $env:GITHUB_ENV

    - name: Install bootstrap release
      shell: pwsh
      run: |
        mkdir ../build
        mkdir ../install
        cd ../install
        curl -fLO "${{ inputs.release }}/${{ inputs.bootstrap }}"
        7z x -o.. "${{ inputs.bootstrap }}"
        rm "${{ inputs.bootstrap }}"
        cmake -S ../bootstrap -B ../build -DCMAKE_INSTALL_PREFIX=%CM3_INSTALL% -A x64
        cmake --build ../build --config Release
        cmake --install ../build --config Release
        "$env:CM3_INSTALL/bin" >> $env:GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v7

    - name: Build everything
      run: python3 scripts/concierge.py full-upgrade all -caltech-other -caltech-parser -m3-scheme

    - name: Run compiler validation suite
      continue-on-error: true
      run: cm3 -DHTML
      working-directory: m3-sys/m3tests
