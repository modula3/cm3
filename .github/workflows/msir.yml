---
name: msir
# MSIR validation ladder on the three ex_stack targets: bootstrap from the
# release, build with the C backend, then the three-stage MSIR bootstrap,
# full m3tests under the MSIR-built compiler, and an IR fixpoint check.
# See m3-sys/msir/test/ci-ladder.sh.

on:
  push:
    branches: [msir]
  workflow_dispatch:

concurrency:
  group: msir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  ladder:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ARM64_DARWIN
            os: macos-latest
          - target: AMD64_DARWIN
            os: macos-15-intel
          - target: AMD64_LINUX
            os: ubuntu-latest

    env:
      CM3_TARGET: ${{ matrix.target }}
      RELEASE: https://github.com/modula3/cm3/releases/download/d5.12.0
      BOOTSTRAP: cm3-boot-${{ matrix.target }}-d5.12.0.tar.xz

    steps:
    # Homebrew no longer ships Intel bottles, so on macos-15-intel it builds
    # LLVM (and python, z3) from source and exceeds the job timeout.  Take
    # the prebuilt osx-64 tools from conda-forge there instead.
    - name: Install prerequisites (Intel macOS)
      if: matrix.target == 'AMD64_DARWIN'
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: llvm
        create-args: llvm-tools=23 ninja coreutils
        init-shell: bash

    - name: Put conda-forge tools on PATH (Intel macOS)
      if: matrix.target == 'AMD64_DARWIN'
      run: echo "$MAMBA_ROOT_PREFIX/envs/llvm/bin" >> $GITHUB_PATH

    - name: Install prerequisites (macOS)
      if: matrix.target == 'ARM64_DARWIN'
      run: |
        brew update
        brew install ninja llvm coreutils
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

    - name: Install prerequisites (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes ninja-build binutils-gold libunwind-dev llvm-22
        sudo ln -sf /usr/bin/llc-22 /usr/local/bin/llc
        sudo ln -sf /usr/bin/opt-22 /usr/local/bin/opt
        sudo ln -sf /usr/bin/llvm-config-22 /usr/local/bin/llvm-config

    - name: Show toolchain
      run: |
        llc --version | head -3
        c++ --version | head -1

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        TAR=tar; command -v gtar >/dev/null && TAR=gtar
        curl --location --silent --fail "$RELEASE/$BOOTSTRAP" | $TAR Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Run the MSIR ladder
      run: m3-sys/msir/test/ci-ladder.sh
      env:
        WORK: ${{ runner.temp }}/msir-ladder

    - name: m3tests report
      if: always() && hashFiles('m3-sys/m3tests/m3tests-results.xml') != ''
      uses: dorny/test-reporter@v2
      with:
        name: ${{ format('m3tests msir ({0})', matrix.target) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Upload ladder outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msir-ladder-${{ matrix.target }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          m3-sys/m3tests/m3tests-results.xml
          ${{ runner.temp }}/msir-ladder/diff-*.txt
          ${{ runner.temp }}/msir-ladder/fixpoint-diff/
          ${{ runner.temp }}/msir-ladder/smoke/

  # MSIR through M3CG on a 32-bit ex_frame target, which the LLVM ladder
  # does not reach: m3tests compiled by MSIRToM3CG (m3-sys/msir/test/ci-m3cg.sh).
  m3cg:
    name: ${{ matrix.target }} (MSIRToM3CG)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        target: [I386_LINUX]

    env:
      CM3_TARGET: ${{ matrix.target }}
      RELEASE: https://github.com/modula3/cm3/releases/download/d5.12.0
      BOOTSTRAP: cm3-boot-${{ matrix.target }}-d5.12.0.tar.xz

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes g++-multilib
        sudo apt-get install --quiet --assume-yes g++-multilib-i686-linux-gnu
        sudo apt-get install --quiet --assume-yes ninja-build binutils-gold

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Install bootstrap release
      env:
        # As i386_linux.yml: not CMAKE_TOOLCHAIN_FILE, which CMake also reads
        # from the environment in try_compile's nested project.
        M3_TOOLCHAIN_FILE: scripts/i686-linux-gnu.toolchain.cmake
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent --fail "$RELEASE/$BOOTSTRAP" | tar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}" -DCMAKE_TOOLCHAIN_FILE="$(pwd)/${M3_TOOLCHAIN_FILE}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Run m3tests through MSIRToM3CG
      run: m3-sys/msir/test/ci-m3cg.sh
      env:
        WORK: ${{ runner.temp }}/msir-m3cg

    - name: m3tests report
      if: always() && hashFiles('m3-sys/m3tests/m3tests-results.xml') != ''
      uses: dorny/test-reporter@v2
      with:
        name: ${{ format('m3tests msircg ({0})', matrix.target) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit
