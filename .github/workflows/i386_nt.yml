---
name: I386_NT

on:
  workflow_call:
    inputs:
      os:
        default: windows-latest
        required: false
        type: string
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-I386_NT-d5.12.0.7z
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        backend: [c, integrated]

    defaults:
      run: {shell: cmd}

    env:
      CM3_TARGET: I386_NT

    steps:
    - name: Install command-line tools
      run: |
        rem procdump lets ci-watchdog.py dump a hung cm3; the build runs without it.
        choco install procdump || echo procdump not installed

    - name: Setup SDK environment
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x86

    - name: Define install location
      run: |
        echo CM3_INSTALL=%CD%\..\install\cm3>>%GITHUB_ENV%

    - name: Install bootstrap release
      run: |
        mkdir ..\build ..\install
        cd ..\install
        curl -fLO "${{ inputs.release }}/${{ inputs.bootstrap }}"
        7z x -o.. "${{ inputs.bootstrap }}"
        cmake -S ..\bootstrap -B ..\build -DCMAKE_INSTALL_PREFIX=%CM3_INSTALL% -A Win32
        cmake --build ..\build --config Release
        cmake --install ..\build --config Release
        echo %CM3_INSTALL%\bin>>%GITHUB_PATH%

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Build everything
      run: |
        python3 scripts\ci-watchdog.py -- python3 scripts\concierge.py full-upgrade --backend "${{ matrix.backend }}" all -caltech-other -caltech-parser -m3-scheme

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        python3 ..\..\scripts\ci-watchdog.py --dumps ..\..\dumps -- cm3 -DHTML
      working-directory: m3-sys\m3tests

    - name: Check m3tests against known failures
      if: ${{ !cancelled() }}
      run: |
        python3 m3-sys\m3tests\check-results.py m3-sys\m3tests\m3tests-results.xml m3-sys\m3tests\known-failures\%CM3_TARGET%-${{ matrix.backend }}

    - name: Upload dumps of a hung cm3
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hang-dumps-I386_NT-${{ matrix.backend }}
        path: dumps
        if-no-files-found: ignore
        retention-days: 14
