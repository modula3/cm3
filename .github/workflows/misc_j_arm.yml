---
name: misc_j_arm
on:
  workflow_call:
    inputs:
      os:
        default: windows-11-arm
        type: string
jobs:
  build-and-test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 35
    env:
      CM3_TARGET: ARM64_NT
    steps:
    - name: environment(cmd)
      shell: cmd
      run: |
        PATH=c:\program files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\arm64;%PATH%
        set LIB=
        set INCLUDE=
        set LIB=%LIB%;c:\program files (x86)\Windows Kits\10\Lib\10.0.22621.0\um\arm64
        set LIB=%LIB%;c:\program files (x86)\Windows Kits\10\Lib\10.0.22621.0\ucrt\arm64
        set LIB=%LIB%;c:\program files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\lib\arm64
        set INCLUDE=%INCLUDE%;c:\program files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\include
        set INCLUDE=%INCLUDE%;C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\ucrt
        set INCLUDE=%INCLUDE%;C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\um
        echo PATH=%PATH%>>%GITHUB_ENV%
        echo INCLUDE=%INCLUDE%>>%GITHUB_ENV%
        echo LIB=%LIB%>>%GITHUB_ENV%
    - name: environment(pwsh)
      shell: pwsh
      run: |
        $env:CM3_INSTALL = "$PWD/../install/cm3"
        mkdir "$env:CM3_INSTALL/bin/config"
        "CM3_INSTALL=$env:CM3_INSTALL" >> $env:GITHUB_ENV
        "$env:CM3_INSTALL/bin" >> $env:GITHUB_PATH
        "EXE=.exe" >> $env:GITHUB_ENV
        $env:GIT_REVISION = $env:GITHUB_SHA.Substring(0, 7)
        $env:BUILD_DATETIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
        "GIT_REVISION=$env:GIT_REVISION" >> $env:GITHUB_ENV
        "BUILD_DATETIME=$env:BUILD_DATETIME" >> $env:GITHUB_ENV

    - name: get source
      uses: actions/checkout@v7

    - name: test1
      shell: cmd
      run: |
        cl
        cl hello.c
        .\hello
