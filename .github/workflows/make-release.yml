---
name: make release

on:
  push:
    tags: ["d*.*.*"]


jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BOOTSTRAP: https://github.com/modula3/cm3/releases/download/d5.12.0/cm3-boot-AMD64_LINUX-d5.12.0.tar.xz

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes ninja-build

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${BOOTSTRAP}" | tar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v2

    - name: Fetch tag
      run: git fetch --force origin ${{ github.ref }}:${{ github.ref }}

    - name: Upgrade compiler
      run: |
        scripts/concierge.py upgrade

    - name: Build distributions
      run: |
        scripts/concierge.py make-dist --target AMD64_LINUX
        scripts/concierge.py make-dist --target AMD64_NT
        scripts/concierge.py make-dist --target I386_LINUX
        scripts/concierge.py make-dist --target I386_NT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-linux
        path: |
          *.7z
          *.tar.xz

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      BOOTSTRAP: https://github.com/modula3/cm3/releases/download/d5.12.1/cm3-boot-ARM64_DARWIN-d5.12.1.tar.xz

    steps:
    - name: Install prerequisites
      run: |
        brew update
        brew install ninja

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${BOOTSTRAP}" | gtar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v2

    - name: Fetch tag
      run: git fetch --force origin ${{ github.ref }}:${{ github.ref }}

    - name: Upgrade compiler
      run: |
        scripts/concierge.py upgrade

    - name: Build distributions
      run: |
        scripts/concierge.py make-dist --target ARM64_DARWIN
        scripts/concierge.py make-dist --target AMD64_DARWIN

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-macos
        path: |
          *.tar.xz

  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-linux

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-macos

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: |
          *.7z
          *.tar.xz
